version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: saniyapur_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-saniyapur}
      POSTGRES_USER: ${POSTGRES_USER:-saniyapur}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-saniyapur_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-saniyapur} -d ${POSTGRES_DB:-saniyapur}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - saniyapur_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: saniyapur_backend
    restart: always
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-production-secret-key-change-me}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-backend,localhost,127.0.0.1,nginx}
      POSTGRES_DB: ${POSTGRES_DB:-saniyapur}
      POSTGRES_USER: ${POSTGRES_USER:-saniyapur}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-saniyapur_secret}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:3000,http://frontend:3000}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost,http://localhost:3000}
      DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-False}
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
    networks:
      - saniyapur_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
    container_name: saniyapur_frontend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
    depends_on:
      - backend
    networks:
      - saniyapur_network

  nginx:
    image: nginx:alpine
    container_name: saniyapur_nginx
    restart: always
    ports:
      - "${PORT_HTTP:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - media_data:/app/media:ro
      - static_data:/app/staticfiles:ro
    depends_on:
      - frontend
      - backend
    networks:
      - saniyapur_network

volumes:
  postgres_data:
  media_data:
  static_data:

networks:
  saniyapur_network:
    driver: bridge
