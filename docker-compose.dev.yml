version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: saniyapur_dev_db
    restart: always
    environment:
      POSTGRES_DB: saniyapur
      POSTGRES_USER: saniyapur
      POSTGRES_PASSWORD: saniyapur_dev_password
    ports:
      - "5432:5432"
    volumes:
      - dev_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saniyapur -d saniyapur"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: saniyapur_dev_backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      DJANGO_SECRET_KEY: dev-secret-key-only-for-local
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
      POSTGRES_DB: saniyapur
      POSTGRES_USER: saniyapur
      POSTGRES_PASSWORD: saniyapur_dev_password
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost:3000
      DJANGO_SECURE_SSL_REDIRECT: "False"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:20-alpine
    container_name: saniyapur_dev_frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
    command: sh -c "npm install && npm run dev"
    depends_on:
      - backend

volumes:
  dev_postgres_data:
