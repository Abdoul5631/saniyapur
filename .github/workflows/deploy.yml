name: Deploy to Production (VPS / Server)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Remote Server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        if: env.SERVER_HOST != ''
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            DEPLOY_DIR=${{ secrets.DEPLOY_DIR || '/var/www/saniyapur' }}
            mkdir -p $DEPLOY_DIR
            cd $DEPLOY_DIR

            # Pull latest changes if git repository exists, or trigger deployment
            if [ -d .git ]; then
              git fetch origin main
              git reset --hard origin/main
            fi

            # Le depot versionne nginx.conf en HTTP ; en prod, remettre le SSL.
            if [ -f nginx/nginx.ssl.conf ] && [ -f certbot/conf/live/jb-saniyapur.com/fullchain.pem ]; then
              cp nginx/nginx.ssl.conf nginx/nginx.conf
            fi

            # Rebuild and restart containers (volumes DB/media conserves)
            docker compose down --remove-orphans || true
            docker compose build --pull
            docker compose up -d
            docker compose exec backend python manage.py migrate --noinput || true
            docker compose exec backend chmod -R a+rX /app/media || true

            # Clean unused images
            docker image prune -f
